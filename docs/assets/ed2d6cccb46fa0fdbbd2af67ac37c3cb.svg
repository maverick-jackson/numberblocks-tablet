span></text><text transform="translate(240,138.13518) scale(0.1426,0.1426)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">As the superhero Octoblock, Eight is brave and</tspan><tspan x="0" dy="46.15px"> heroic, narrowing down to helping others </tspan><tspan x="0" dy="46.15px">in need with numerous different abilities </tspan><tspan x="0" dy="46.15px">that he can use at his disposal for different</tspan><tspan x="0" dy="46.15px">situations, as  well as being very </tspan><tspan x="0" dy="46.15px">reliable in thwarting the schemes</tspan><tspan x="0" dy="46.15px">of his enemy, Octonaughty.</tspan></text><text transform="translate(240,209.5364) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 2×4</tspan></text><text transform="translate(240,238.95547) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- despite being enemies, he cares about</tspan><tspan x="0" dy="48px">Octonaughty's well-being</tspan><tspan x="0" dy="48px">- very friendly (and touchy)</tspan><tspan x="0" dy="48px">- good at sports</tspan></text></g></g></svg>