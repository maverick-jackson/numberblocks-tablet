an></text><text transform="translate(240,140.46686) scale(0.19521,0.19521)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Ten is kind, caring, smart, gentle, joyful,</tspan><tspan x="0" dy="46.150000000000006px"> curious, and friendly, just like One. She</tspan><tspan x="0" dy="46.150000000000006px"> normally faces tough situations by</tspan><tspan x="0" dy="46.150000000000006px"> making a plan, rather than jumping</tspan><tspan x="0" dy="46.150000000000006px"> into action.</tspan></text><text transform="translate(240,209.53639) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 2×5 / 1×10</tspan></text><text transform="translate(240,244.17997) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- puts others' needs before hers</tspan><tspan x="0" dy="48px">- is willing to help any chance she gets</tspan></text></g></g></svg>