="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle" style="mix-blend-mode: normal"><tspan x="0" dy="0">TWENTY-EIGHT</tspan></text><text transform="translate(240,140.42368) scale(0.14638,0.14638)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle" style="mix-blend-mode: normal"><tspan x="0" dy="0">Twenty-Eight is a pattern pioneer who can make lots of patterns</tspan><tspan x="0" dy="48px">as seen in Making Patterns and Four on the Floor. She is also </tspan><tspan x="0" dy="48px">the seventh step squad and a super rectangle. Like Nineteen,</tspan><tspan x="0" dy="48px"> whom Twenty-Eight is shown to be influenced by in her debut,</tspan><tspan x="0" dy="48px"> she greatly enjoys making different arrangements with her </tspan><tspan x="0" dy="48px">number and showing them off.</tspan></text><text transform="translate(240,209.53643) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle" style="mix-blend-mode: normal"><tspan x="0" dy="0">M.A: 3+(1[&gt;]1+3)×5</tspan></text><text transform="translate(240,248.83343) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle" style="mix-blend-mode: normal"><tspan x="0" dy="0">- hasn't used her array display once</tspan><tspan x="0" dy="48px">- first super rectangle "perfect number"</tspan></text></g></g></svg>