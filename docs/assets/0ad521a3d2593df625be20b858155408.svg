-THREE</tspan></text><text transform="translate(155.51012,209.76768) scale(0.22454,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">M.A: (10×2)+(1[&gt;8]1)×4+(1[&gt;2]3[&gt;3]1)+10</tspan></text><text transform="translate(163.13497,253.38288) scale(0.17333,0.17333)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- Second member of Forty's secret survey crew</tspan></text><text transform="translate(155.77061,154.80894) scale(0.16812,0.16812)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Forty-Three seems to always be obsessed with being</tspan></text><text transform="translate(148.40889,161.69088) scale(0.16813,0.16813)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">a movie director. He even pretends to be one sometimes.</tspan></text></g></g></svg>