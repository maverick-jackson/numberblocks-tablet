/text><text transform="translate(216.78277,248.57461) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">compounds</tspan></text><text transform="translate(152.1565,258.55348) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">- can get disappointed if compounds want to</tspan></text><text transform="translate(157.28067,268.57461) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">stay as such rather than being figured out</tspan></text></g></g></svg>