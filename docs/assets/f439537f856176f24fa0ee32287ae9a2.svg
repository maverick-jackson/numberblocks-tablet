E</tspan></text><text transform="translate(240,144.27566) scale(0.14234,0.14234)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Sixty-Three is shown to be generally extroverted, seeing as how </tspan><tspan x="0" dy="48px">he initiates most of the conversations he has in his only leading </tspan><tspan x="0" dy="48px">role, The Rainbow Makers. He is also seen complimenting most </tspan><tspan x="0" dy="48px">of the others on their murals, which shows he supports his </tspan><tspan x="0" dy="48px">friends by showing his interest in what they do.</tspan></text><text transform="translate(240,209.53641) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 7×9</tspan></text><text transform="translate(240,243.89445) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- cares a lot for the Rainbow Sevens</tspan><tspan x="0" dy="48px">- can't hide his emotions/feelings, especially</tspan><tspan x="0" dy="48px">about himself</tspan></text></g></g></svg>