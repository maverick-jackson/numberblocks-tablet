/tspan></text><text transform="translate(240,141.92927) scale(0.16607,0.17028)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Seventeen has an intense passion and talent for </tspan><tspan x="0" dy="48px">painting, having the ability to paint objects and other</tspan><tspan x="0" dy="48px"> portraits in seconds. He is shown to be rather heedless,</tspan><tspan x="0" dy="48px"> discarding the emotions of others and even his own</tspan><tspan x="0" dy="48px"> well-being in order to paint.</tspan></text><text transform="translate(240,208.51378) scale(0.39551,0.39551)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 1R+4+(3×2)L+(2×3)C</tspan></text><text transform="translate(240,244.04195) scale(0.20169,0.20169)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- can paint 17 of anything in seconds (struggles</tspan><tspan x="0" dy="48px">with other numbers of things)</tspan><tspan x="0" dy="48px">- paintings can come to life</tspan></text></g></g></svg>