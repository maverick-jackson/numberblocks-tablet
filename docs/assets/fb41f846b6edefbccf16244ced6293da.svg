<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="195.14095" height="195.14095" viewBox="0,0,195.14095,195.14095"><g transform="translate(-142.42953,-82.42955)"><g stroke-miterlimit="10"><path d="M148.00214,275.0705c-1.69695,0 -3.07261,-1.37565 -3.07261,-3.07261v-183.99574c0,-1.69695 1.37566,-3.0726 3.07261,-3.0726h183.99573c1.69695,0 3.07261,1.37565 3.07261,3.0726v183.99574c0,1.69695 -1.37566,3.07261 -3.07261,3.07261z" fill-opacity="0.74902" fill="#b3d1ff" stroke="#3246ae" stroke-width="5"></path><path d="M150.48056,180.00005c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61175 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,227.53526c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31991c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,132.46479c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31992c0,-0.61174 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31992c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,275.0705c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61174 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><text transform="translate(240,114.46594) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">THIRTY-NINE</tspan></text><text transform="translate(240,138.92737) scale(0.16023,0.16023)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">'Groovy-mover' Thirty-Nine is a circus clown fond of </tspan><tspan x="0" dy="48px">performing. When mesmerising his audience, his grey</tspan><tspan x="0" dy="48px">blocks are often "on the move". He often has the crowd</tspan><tspan x="0" dy="48px">say his name very slowly, as they say “Thirty-N…” he</tspan><tspan x="0" dy="48px">interrupts with “Thirteen?” causing his 3 unlucky</tspan><tspan x="0" dy="48px">Thirteens to fall apart and split into 3 Tens and Threes.</tspan></text><text transform="translate(240,209.53641) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 5×3+(3×8)C</tspan></text><text transform="translate(157.89553,249.06246) scale(0.11982,0.11982)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- Though stating directly that he will split into 3 Tens and 3 Threes when</tspan></text><text transform="translate(164.45905,256.41889) scale(0.11982,0.11982)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">someone says Thirty-Nine, he never actually did ever in the series.</tspan></text></g></g></svg>