<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="195.14095" height="195.14095" viewBox="0,0,195.14095,195.14095"><g transform="translate(-142.42953,-82.42955)"><g stroke-miterlimit="10"><path d="M148.00214,275.0705c-1.69695,0 -3.07261,-1.37565 -3.07261,-3.07261v-183.99574c0,-1.69695 1.37566,-3.0726 3.07261,-3.0726h183.99573c1.69695,0 3.07261,1.37565 3.07261,3.0726v183.99574c0,1.69695 -1.37566,3.07261 -3.07261,3.07261z" fill-opacity="0.74902" fill="#b3d1ff" stroke="#3246ae" stroke-width="5"></path><path d="M150.48056,180.00005c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61175 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,227.53526c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31991c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,132.46479c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31992c0,-0.61174 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31992c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,275.0705c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61174 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><text transform="translate(240,114.46594) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">THIRTY-EIGHT</tspan></text><text transform="translate(240,139.15164) scale(0.15816,0.15816)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Thirty-Eight is absent-minded and forgetful. He knows</tspan><tspan x="0" dy="48px">he can split exactly in two but often doesn’t remember</tspan><tspan x="0" dy="48px">what he splits into. His favourite trick to help him</tspan><tspan x="0" dy="48px">remember is to split into Twenty and Eighteen, then</tspan><tspan x="0" dy="48px">split them into 2 Tens and 2 Nines, and then finally into</tspan><tspan x="0" dy="48px"> 2 Nineteens.</tspan></text><text transform="translate(240,209.53641) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 2L+4×9</tspan></text><text transform="translate(149.10926,249.05685) scale(0.13628,0.13628)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- Similar to how 19 is one away from two super rectangles (18 and 20),</tspan></text><text transform="translate(170.8561,256.81955) scale(0.13628,0.13628)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">38 is two away from two super rectangles (36 and 40)</tspan></text></g></g></svg>