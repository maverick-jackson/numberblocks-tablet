-ONE</tspan></text><text transform="translate(170.21002,209.76768) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">M.A: 1CL+4×10</tspan></text><text transform="translate(148.61664,248.34762) scale(0.14809,0.14809)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">-her one block alarm goes off when she fails to make a rectangle</tspan></text><text transform="translate(153.87818,154.75275) scale(0.12331,0.12331)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Forty-One is always trying to form herself into a rectangle, similar to how</tspan></text><text transform="translate(204.35369,160.67161) scale(0.12331,0.12331)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nineteen wants to be one too.</tspan></text><text transform="translate(179.18242,257.81236) scale(0.14809,0.14809)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">-First member of Forty's secret survey crew</tspan></text></g></g></svg>