tspan></text><text transform="translate(240,141.77329) scale(0.17213,0.17213)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Naturally extroverted and athletic, Fourteen</tspan><tspan x="0" dy="48px"> is a “double-lucky” skateboarder. His attitude</tspan><tspan x="0" dy="48px"> matches that of a stereotypical teenager, </tspan><tspan x="0" dy="48px">often diving head-first into rebellious </tspan><tspan x="0" dy="48px">and chaotic situations without concern.</tspan></text><text transform="translate(240,209.53641) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 2×7</tspan></text><text transform="translate(240,238.95548) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- Pro Skater</tspan><tspan x="0" dy="48px">- refers to the Numberblocks as Numberdudes</tspan><tspan x="0" dy="48px">- uses skater lingo</tspan><tspan x="0" dy="48px">- double lucky, double Sevens!</tspan></text></g></g></svg>