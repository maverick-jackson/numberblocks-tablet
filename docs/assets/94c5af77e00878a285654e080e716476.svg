pan></text><text transform="translate(240,140.06698) scale(0.20016,0.20016)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Five is a lively, talented rockstar. She's most</tspan><tspan x="0" dy="46.150000000000006px">often playing on her guitar, but she can sing as</tspan><tspan x="0" dy="46.150000000000006px">well. She's a fan of stars, a big fan of</tspan><tspan x="0" dy="46.150000000000006px">rock music, and an even bigger fan of giving</tspan><tspan x="0" dy="46.150000000000006px">out high-fives with her big high-five glove.</tspan></text><text transform="translate(240,209.76763) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 1×5</tspan></text><text transform="translate(240,243.89443) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- often says "I feel alive!"</tspan><tspan x="0" dy="48px">- can be sensible, but can also be silly</tspan><tspan x="0" dy="48px">- generally a selfless friend</tspan></text></g></g></svg>