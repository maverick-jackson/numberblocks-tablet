<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="195.14095" height="195.14095" viewBox="0,0,195.14095,195.14095"><g transform="translate(-142.42953,-82.42955)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M148.00214,275.0705c-1.69695,0 -3.07261,-1.37565 -3.07261,-3.07261v-183.99574c0,-1.69695 1.37566,-3.0726 3.07261,-3.0726h183.99573c1.69695,0 3.07261,1.37565 3.07261,3.0726v183.99574c0,1.69695 -1.37566,3.07261 -3.07261,3.07261z" fill-opacity="0.74902" fill="#b3d1ff" stroke="#3246ae" stroke-width="5"></path><path d="M150.48056,180.00005c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61175 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,227.53526c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31991c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,132.46479c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31992c0,-0.61174 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31992c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,275.0705c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61174 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><text transform="translate(240,114.46594) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle" style="mix-blend-mode: normal"><tspan x="0" dy="0">SEVENTY-TWO</tspan></text><text transform="translate(160.3475,143.95335) scale(0.14524,0.14524)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Seventy-Two lacks a lot of information on her personality,</tspan></text><text transform="translate(240,209.53641) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle" style="mix-blend-mode: normal"><tspan x="0" dy="0">M.A: 6×12</tspan></text><text transform="translate(150.58108,245.21216) scale(0.20077,0.20077)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">- her motto is "Seventy-Two with a big achOO!"</tspan></text><text transform="translate(167.67062,253.71213) scale(0.20077,0.20077)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">- Associated with Numberblock Fun, a</tspan></text><text transform="translate(194.56977,262.2121) scale(0.20077,0.20077)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Numberblock YouTuber</tspan></text><text transform="translate(166.16869,151.04882) scale(0.14524,0.14524)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">but she is a super sneezer, who can split into 8 Nines,</tspan></text><text transform="translate(169.9101,158.04882) scale(0.14524,0.14524)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">those eight Nines can then sneeze their noses out,</tspan></text><text transform="translate(166.66253,164.89551) scale(0.14524,0.14524)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">their 8 noses adding up to an instant Octoblock, who</tspan></text><text transform="translate(160.08316,171.99729) scale(0.14524,0.14524)" font-size="40" xml:space="preserve" fill="#006bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">does not need to count to 8 with his blocks to do a power.</tspan></text></g></g></svg>