tspan></text><text transform="translate(240,143.64591) scale(0.14346,0.14984)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Eleven is an upbeat, high-spirited Numberblock who takes great</tspan><tspan x="0" dy="48px"> pride and passion in football. She often spends much</tspan><tspan x="0" dy="48px">of her time practicing and competing in football games.</tspan><tspan x="0" dy="48px">Despite prioritizing football as her main passion, Eleven is</tspan><tspan x="0" dy="48px">very inclusive of her friends, often inviting others to play with her.</tspan></text><text transform="translate(240,209.76763) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 1R+2×5</tspan></text><text transform="translate(240,243.89443) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- can perform keepy-uppy to 11</tspan><tspan x="0" dy="48px">- splits into her own team of 11 Ones</tspan><tspan x="0" dy="48px">- is rather easygoing</tspan></text></g></g></svg>