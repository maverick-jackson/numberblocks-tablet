tspan></text><text transform="translate(240,146.37022) scale(0.11381,0.11741)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Despite typically laughing his unluckiness off, Thirteen is</tspan><tspan x="0" dy="48px">shown to be heavily impacted by the actions of others, often expressing</tspan><tspan x="0" dy="48px">sadness and disappointment when he is subjected to anger and frustration. </tspan><tspan x="0" dy="48px">He is also shown to be more anxious and fearful in more serious and</tspan><tspan x="0" dy="48px">problematic situations, often straying to the side rather than actively participating.</tspan></text><text transform="translate(240,209.53641) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 2R+3+(2×4)L</tspan></text><text transform="translate(240,243.89444) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- insert Tween Scenes laughing fit</tspan><tspan x="0" dy="48px">- saying his name makes him split into a Ten</tspan><tspan x="0" dy="48px">and a Three</tspan></text></g></g></svg>