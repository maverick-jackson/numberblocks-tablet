<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="195.14095" height="195.14095" viewBox="0,0,195.14095,195.14095"><g transform="translate(-142.42953,-82.42955)"><g stroke-miterlimit="10"><path d="M148.00214,275.07051c-1.69695,0 -3.07261,-1.37565 -3.07261,-3.07261v-183.99574c0,-1.69695 1.37566,-3.0726 3.07261,-3.0726h183.99573c1.69695,0 3.07261,1.37565 3.07261,3.0726v183.99574c0,1.69695 -1.37566,3.07261 -3.07261,3.07261z" fill-opacity="0.74902" fill="#b3d1ff" stroke="#3246ae" stroke-width="5"></path><path d="M150.48056,180.00006c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61175 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,227.53527c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31991c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,132.4648c-3.06575,0 -5.55103,-0.49591 -5.55103,-1.10766v-45.31992c0,-0.61174 2.48528,-1.10766 5.55103,-1.10766h179.03888c3.06575,0 5.55104,0.49591 5.55104,1.10766v45.31992c0,0.61175 -2.48529,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><path d="M150.48056,275.07051c-3.06575,0 -5.55103,-0.49592 -5.55103,-1.10766v-45.31991c0,-0.61175 2.48528,-1.10766 5.55103,-1.10766h179.03887c3.06576,0 5.55104,0.49592 5.55104,1.10766v45.31991c0,0.61174 -2.48528,1.10766 -5.55104,1.10766z" fill="none" stroke="#3246ae" stroke-width="1"></path><text transform="translate(240,114.46595) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">FORTY-EIGHT</tspan></text><text transform="translate(240,141.94571) scale(0.17008,0.17008)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Forty-Eight is a lively Numberblock who, like </tspan><tspan x="0" dy="48px">Twenty-Four, is always ready for anything. She takes</tspan><tspan x="0" dy="48px">pride in racing with others and is very competitive, as in </tspan><tspan x="0" dy="48px">Rescue Racers, she said it’d be more fun with </tspan><tspan x="0" dy="48px">someone to race against.</tspan></text><text transform="translate(240,209.53642) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 8×6</tspan></text><text transform="translate(151.67496,239.6593) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- can split into 8 "chunky" Sixes or 6 "chunky"</tspan></text><text transform="translate(160.73385,267.88544) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- is the only block with uneven eyebrows</tspan></text><text transform="translate(188.3673,248.05746) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Eights using her eyebrows</tspan></text><text transform="translate(168.51271,258.10203) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- her motto is "Forty-Eight, activate!"</tspan></text></g></g></svg>