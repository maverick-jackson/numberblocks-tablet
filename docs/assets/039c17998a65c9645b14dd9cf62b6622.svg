span></text><text transform="translate(240,139.71174) scale(0.20456,0.20456)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Seven is a joyous Numberblock and is proud</tspan><tspan x="0" dy="46.150000000000006px">of his luckiness.  With his luck, he has no fear </tspan><tspan x="0" dy="46.150000000000006px">of any situation and is also very helpful,</tspan><tspan x="0" dy="46.150000000000006px">and can help others using his luck. He never</tspan><tspan x="0" dy="46.150000000000006px"> seems to intentionally show off his luck, either.</tspan></text><text transform="translate(240,209.53639) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 1×7</tspan></text><text transform="translate(240,248.83339) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- Oh So Lucky</tspan><tspan x="0" dy="48px">- immune to every status except for hiccups.</tspan></text></g></g></svg>