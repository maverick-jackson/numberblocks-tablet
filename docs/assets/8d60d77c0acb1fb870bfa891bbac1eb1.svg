VEN</tspan></text><text transform="translate(240,140.67403) scale(0.18522,0.18522)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Thirty-Seven is quirky, clever, kind, and fond</tspan><tspan x="0" dy="48px">of solving problems. She is "full of crazy ideas",</tspan><tspan x="0" dy="48px"> often arranging her blocks into arrows to</tspan><tspan x="0" dy="48px">point a way. When she takes off her hat, Hatty,</tspan><tspan x="0" dy="48px">it helps her split into smaller numbers.</tspan></text><text transform="translate(240,209.76766) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 5x2+(3x9)C</tspan></text><text transform="translate(149.37833,244.40024) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- Second numberblock to be figured out in the</tspan></text><text transform="translate(171.71303,263.1445) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- Thirty Seven's hat is named Hatty</tspan></text><text transform="translate(157.25186,253.77237) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">first episode of a season. The first was Six.</tspan></text></g></g></svg>