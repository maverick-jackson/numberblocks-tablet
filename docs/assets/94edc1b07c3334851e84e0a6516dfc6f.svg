span></text><text transform="translate(240,141.4429) scale(0.13694,0.13694)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">Thirty is the self-proclaimed "greatest show in Numberland",</tspan><tspan x="0" dy="48px"> a title that surely rings true. As she is not only an entertainer </tspan><tspan x="0" dy="48px">but also a circus, she and her friends can put on a show for </tspan><tspan x="0" dy="48px">everybody within her magical hat. Between her talents and her </tspan><tspan x="0" dy="48px">supportive attitude, she is always bound to bring joy </tspan><tspan x="0" dy="48px">throughout Numberland.</tspan></text><text transform="translate(240,209.53642) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">M.A: 3×10</tspan></text><text transform="translate(240,253.77237) scale(0.20579,0.20579)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="middle"><tspan x="0" dy="0">- has a magic hat that becomes a Big Top</tspan></text></g></g></svg>