Y-SIX</tspan></text><text transform="translate(159.52636,249.22295) scale(0.17333,0.17333)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">-She has a flower on her representing 23 pairs of</tspan></text><text transform="translate(158.85187,150.17966) scale(0.16812,0.16812)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Forty-Six is an expert in mysterious cosmic energy,</tspan></text><text transform="translate(175.86514,166.32002) scale(0.16813,0.16813)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Twenty-Three. She's also a deep thinker.</tspan></text><text transform="translate(175.57002,209.76769) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">M.A: 2C+4×11</tspan></text><text transform="translate(161.09998,158.24978) scale(0.16813,0.16813)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">and twice as happy being herself, as she's double</tspan></text><text transform="translate(188.60766,257.54279) scale(0.17333,0.17333)" font-size="40" xml:space="preserve" fill="#006bff" stroke="none" stroke-width="1" font-family="&quot;BlocksUniverse-Numberling&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">chromosomes, adding up to 46</tspan></text></g></g></svg>